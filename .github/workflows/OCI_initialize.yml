name: OCI Always Free A1 Instance Monitor

on:
  # The workflow is intentionally self-dispatched. There is no 6-hour
  # schedule, so there is no fixed scheduler gap between polling windows.
  workflow_dispatch:

# Only one provisioning run may execute at a time. The next handoff run is
# intentionally queued while the current run is finishing, then starts after
# the current run exits.
concurrency:
  group: oci-a1-provisioner
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  provision:
    runs-on: ubuntu-latest

    # The Python polling window is 180 minutes. Extra time allows checkout,
    # package installation, the handoff delay, and GitHub runner overhead.
    timeout-minutes: 195

    steps:
      - name: Handoff buffer
        run: sleep 10

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run OCI provisioner
        id: provisioner
        env:
          PYTHONUNBUFFERED: "1"

          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}

        run: python Server/Script.py

      - name: Start next polling window
        if: ${{ steps.provisioner.outputs.status == 'CONTINUE' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Polling window ended normally."
          echo "Waiting 10 seconds before requesting exactly one fresh workflow run..."
          sleep 10

          for attempt in 1 2 3; do
            echo "Dispatch attempt ${attempt}/3"

            if gh workflow run OCI_initialize.yml --ref main; then
              echo "✅ Fresh workflow run requested."
              exit 0
            fi

            echo "⚠️ Dispatch failed; waiting 5 seconds before retry."
            sleep 5
          done

          echo "❌ Could not dispatch the next polling window."
          exit 1
