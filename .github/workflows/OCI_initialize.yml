name: OCI Always Free A1 Instance Monitor

on:
  # GitHub scheduled workflows use UTC.
  # A new long polling run starts approximately every 6 hours.
  schedule:
    - cron: "0 */6 * * *"

  # Allows you to start one run manually from Actions.
  workflow_dispatch:

# Never run two provisioning jobs at the same time.
concurrency:
  group: oci-a1-provisioner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest

    # 350 minutes is below GitHub's 6-hour hosted-job ceiling.
    timeout-minutes: 350

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run OCI provisioner
        env:
          PYTHONUNBUFFERED: "1"

          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_PUBLIC_SSH_KEY: ${{ secrets.OCI_PUBLIC_SSH_KEY }}

        run: python Server/Script.py
